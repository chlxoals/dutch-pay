<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>더치페이 정산기</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Malgun Gothic", sans-serif; background: #f4f6fa; color: #222; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; }
  input { width: 100%; font-size: 16px; padding: 12px; border: 1px solid #ccd; border-radius: 8px; margin-bottom: 10px; }
  button { font-size: 16px; padding: 12px 16px; border: 0; border-radius: 8px; background: #3b6cf6; color: #fff; cursor: pointer; min-height: 44px; }
  button.sub { background: #e5e9f5; color: #333; }
  button.full { width: 100%; }
  .row { display: flex; gap: 8px; }
  .row input { margin-bottom: 0; }
  .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
  .item:last-child { border-bottom: 0; }
  .del { background: none; color: #d33; padding: 4px 10px; min-height: 0; }
  .result { font-size: 18px; line-height: 1.8; }
  .total { font-weight: bold; font-size: 20px; }
  .empty { color: #999; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💸 더치페이 정산기</h1>

  <div class="card">
    <label>참여자 이름</label>
    <div class="row">
      <input id="name" type="text" placeholder="예: 민수" enterkeyhint="done">
      <button id="addPerson">추가</button>
    </div>
    <div id="people"></div>
  </div>

  <div class="card">
    <label>총 금액 (원)</label>
    <input id="amount" type="number" inputmode="numeric" placeholder="예: 52000">
    <button class="full" id="calc">정산하기</button>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="result" id="result"></div>
  </div>

  <button class="sub full" id="reset">처음부터 다시</button>
</div>

<script>
  let people = [];
  const $ = id => document.getElementById(id);

  function renderPeople() {
    const box = $("people");
    if (!people.length) { box.innerHTML = '<p class="empty">참여자를 추가해 주세요.</p>'; return; }
    box.innerHTML = people.map((p, i) =>
      `<div class="item"><span>${p.replace(/</g, "&lt;")}</span><button class="del" data-i="${i}">삭제</button></div>`
    ).join("");
  }

  function addPerson() {
    const v = $("name").value.trim();
    if (!v) return;
    people.push(v);
    $("name").value = "";
    renderPeople();
    $("name").focus();
  }

  function calc() {
    const total = parseInt($("amount").value, 10);
    if (people.length < 2) { alert("참여자를 2명 이상 추가해 주세요."); return; }
    if (!total || total <= 0) { alert("총 금액을 입력해 주세요."); return; }
    const n = people.length;
    const base = Math.floor(total / n / 10) * 10; // 10원 단위 내림
    const rest = total - base * n;                // 남는 금액은 첫 번째 사람이 부담
    let html = `<div class="total">총 ${total.toLocaleString()}원 / ${n}명</div>`;
    people.forEach((p, i) => {
      const pay = base + (i === 0 ? rest : 0);
      html += `<div>${p.replace(/</g, "&lt;")}: <b>${pay.toLocaleString()}원</b></div>`;
    });
    if (rest > 0) html += `<div class="empty">10원 단위로 나누고 남은 ${rest.toLocaleString()}원은 ${people[0].replace(/</g, "&lt;")}님이 더 냅니다.</div>`;
    $("result").innerHTML = html;
    $("resultCard").style.display = "block";
  }

  $("addPerson").onclick = addPerson;
  $("name").addEventListener("keydown", e => { if (e.key === "Enter") addPerson(); });
  $("people").addEventListener("click", e => {
    if (e.target.dataset.i !== undefined) { people.splice(+e.target.dataset.i, 1); renderPeople(); }
  });
  $("calc").onclick = calc;
  $("reset").onclick = () => { people = []; $("amount").value = ""; $("resultCard").style.display = "none"; renderPeople(); };
  renderPeople();
</script>
</body>
</html>
