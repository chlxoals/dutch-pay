<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행·모임 정산</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1319'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23c9a45c' stroke-width='4'/%3E%3Ctext x='32' y='41' font-size='26' font-weight='700' text-anchor='middle' fill='%23c9a45c' font-family='sans-serif'%3E%E2%82%A9%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<meta name="theme-color" content="#0f1319">
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; --bg:#0f1319; --card:#171c25; --line:#262d3a; --text:#e4e7ec; --mute:#8d96a7; --accent:#c9a45c; --danger:#d9827f; }
  body { margin: 0; font-family: Pretendard, -apple-system, "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); letter-spacing: -0.01em; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 96px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  h1::after { content: ""; display: block; width: 28px; height: 2px; background: var(--accent); margin-top: 10px; }
  .sub-title { color: var(--mute); font-size: 13px; margin: 10px 0 16px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 12px; letter-spacing: .02em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: var(--mute); margin: 10px 0 4px; }
  input, select { width: 100%; font-size: 16px; padding: 11px 12px; border: 1px solid #2f3746; border-radius: 6px; background: var(--bg); color: var(--text); }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input::placeholder { color: #566074; }
  button { font-size: 15px; padding: 11px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #17130a; font-weight: 600; cursor: pointer; min-height: 42px; }
  button.sub { background: transparent; color: var(--text); border: 1px solid #353e4e; font-weight: 500; }
  button.small { font-size: 13px; padding: 6px 10px; min-height: 32px; }
  button.full { width: 100%; margin-top: 12px; }
  .del { background: none; border: 0; color: var(--danger); padding: 4px 8px; min-height: 0; font-size: 13px; font-weight: 500; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > * { flex: 1; min-width: 0; }
  .row > button { flex: 0 0 auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { background: transparent; color: var(--text); border: 1px solid #2f3746; font-weight: 500; font-size: 14px; padding: 8px 12px; min-height: 36px; border-radius: 6px; }
  .chip.on { border-color: var(--accent); color: var(--accent); background: rgba(201,164,92,.1); }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .checks label { display: flex; align-items: center; gap: 6px; margin: 0; padding: 9px 12px; border: 1px solid #2f3746; border-radius: 6px; font-size: 14px; color: var(--text); }
  .checks input { width: 18px; height: 18px; padding: 0; }
  .mem { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .mem:last-child { border-bottom: 0; }
  .mem b { flex: 1; font-weight: 500; }
  .mem input { width: 80px; padding: 7px 8px; font-size: 14px; }
  .exp { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .exp:last-child { border-bottom: 0; }
  .exp .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .exp small, .mute { color: var(--mute); font-size: 12px; display: block; margin-top: 2px; }
  .empty { color: #667084; font-size: 14px; margin: 6px 0 0; }
  .line { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .line:last-child { border-bottom: 0; }
  .total { font-size: 18px; font-weight: 700; margin: 0 0 8px; }
  .tr { padding: 10px; background: #1d2430; border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; font-size: 15px; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 7px 0; font-size: 13px; }
  .bar .lb { width: 64px; flex: none; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .bg { flex: 1; height: 14px; background: #0f1319; border-radius: 3px; overflow: hidden; }
  .bar .bg i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .bar .val { width: 92px; flex: none; text-align: right; }
  .big { font-size: 28px; font-weight: 700; color: var(--accent); margin: 8px 0 2px; word-break: break-all; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: #1d2430; border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  .stat b { display: block; font-size: 17px; margin-top: 2px; }
  .rate-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; }
  .rate-row span { flex: 1; }
  .rate-row input { width: 110px; padding: 8px 10px; font-size: 15px; text-align: right; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0b0e13; border-top: 1px solid var(--line); display: flex; justify-content: center; z-index: 5; }
  nav .in { display: flex; width: 100%; max-width: 520px; }
  nav button { flex: 1; background: none; color: var(--mute); border-radius: 0; font-weight: 500; font-size: 14px; min-height: 56px; border-top: 2px solid transparent; }
  nav button.on { color: var(--accent); border-top-color: var(--accent); }
  textarea { width: 100%; font-size: 13px; padding: 10px; border: 1px solid #2f3746; border-radius: 6px; background: var(--bg); color: var(--text); min-height: 120px; margin-top: 10px; }
  #toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; display: none; z-index: 9; max-width: 90%; }
  .note { font-size: 12px; color: var(--mute); margin-top: 8px; line-height: 1.5; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; padding: 8px 4px; }
  nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .logo { width: 28px; height: 28px; vertical-align: -7px; margin-right: 10px; }
  .plan-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .plan-row:last-of-type { border-bottom: 0; }
  .plan-row .pn { width: 40px; flex: none; font-size: 14px; }
  .plan-row input { width: 100px; flex: none; padding: 8px; font-size: 15px; text-align: right; }
  .pv { flex: 1; text-align: right; font-size: 14px; min-width: 0; }
  .pv small { display: block; color: var(--mute); font-size: 12px; margin-top: 2px; }
  .bar .bg.stack { display: flex; position: relative; }
  .bar .bg.stack i { flex: none; border-radius: 0; }
  .bar .bg.stack u { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; opacity: .75; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 8px; font-size: 12px; color: var(--mute); }
  .lg { display: inline-flex; align-items: center; }
  .cmp { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .cmp:last-child { border-bottom: 0; }
  .cmp-h { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 2px; }
  .pie { width: 160px; height: 160px; border-radius: 50%; margin: 4px auto 14px; }
  .tr.done { opacity: .55; }
  .tr.done b { text-decoration: line-through; }
  label.sentchk, label.fundchk { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 14px; color: var(--text); }
  label.sentchk input, label.fundchk input { width: 18px; height: 18px; padding: 0; }
  details { margin-top: 10px; }
  summary { color: var(--accent); cursor: pointer; font-size: 14px; padding: 8px 0; }
  .big-tr { font-size: 18px; padding: 14px 12px; }
  .erow { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #131820; }
  .erow-head { display: flex; justify-content: space-between; align-items: center; }
  .erow-head b { color: var(--accent); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><svg class="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#171c25"/><circle cx="32" cy="32" r="21" fill="none" stroke="#c9a45c" stroke-width="4"/><text x="32" y="41" font-size="26" font-weight="700" text-anchor="middle" fill="#c9a45c" font-family="sans-serif">₩</text></svg>여행·모임 정산</h1>
  <p class="sub-title" id="tripLine"></p>
  <div id="view"></div>
</div>
<nav><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg><span>정산</span></button>
  <button data-tab="rates"><svg viewBox="0 0 24 24"><path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/></svg><span>환율</span></button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20v-6M12 20V4M19 20v-10"/></svg><span>통계</span></button>
  <button data-tab="budget"><svg viewBox="0 0 24 24"><path d="M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 7l12-3v3M17 14h2"/></svg><span>예산</span></button>
</div></nav>
<div id="toast"></div>

<script>
// ============ 기본 데이터 ============
const CURS = { // [이름, 참고용 기본 환율(1단위 = 원), 기호, 짧은 이름]
  KRW: ["대한민국 원", 1, "₩", "원"], JPY: ["일본 엔", 9.2, "¥", "엔"], USD: ["미국 달러", 1400, "$", "달러"], EUR: ["유로", 1500, "€", "유로"],
  GBP: ["영국 파운드", 1750, "£", "파운드"], CNY: ["중국 위안", 195, "元", "위안"], THB: ["태국 바트", 42, "฿", "바트"],
  VND: ["베트남 동", 0.055, "₫", "동"], TWD: ["대만 달러", 44, "NT$", "대만달러"], AUD: ["호주 달러", 920, "A$", "호주달러"]
};
const cs = c => CURS[c][2];   // 기호 ($)
const ck = c => CURS[c][3];   // 짧은 한글 이름 (달러)
const CATS = ["식비", "교통", "쇼핑", "기타"]; // 현지 예산·통계용 (숙박은 미리 예약해 따로 나누므로 제외)
const ALLCATS = ["식비", "교통", "숙박", "쇼핑", "기타"]; // 정산 탭 지출 분류용
const KEYWORDS = {
  교통: ["택시", "버스", "지하철", "전철", "기차", "공항", "렌트", "주유", "교통", "열차", "신칸센"],
  식비: ["식당", "라멘", "카페", "커피", "밥", "술", "맥주", "고기", "초밥", "점심", "저녁", "아침", "식비", "편의점", "우동", "빵"],
  숙박: ["호텔", "숙소", "에어비앤비", "게스트", "숙박", "민박", "리조트"],
  쇼핑: ["쇼핑", "기념품", "옷", "마트", "돈키", "면세", "선물", "약국"]
};
const KEY = "travelpay_v1";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const won = n => Math.round(n).toLocaleString("ko-KR") + "원";
const num = (n, d = 2) => Number(n).toLocaleString("ko-KR", { maximumFractionDigits: d });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

function defaultRates() { const r = {}; Object.keys(CURS).forEach(c => r[c] = CURS[c][1]); return r; }
let S = { trips: [], cur: null, rates: defaultRates(), rateTime: "" };
try { const raw = JSON.parse(localStorage.getItem(KEY)); if (raw) S = Object.assign(S, raw); } catch (e) {}
S.rates = Object.assign(defaultRates(), S.rates);
// 예전에 만든 예시 여행 자동 정리
S.trips = (S.trips || []).filter(t => !/\(예시\)$/.test(t.name));
if (!S.trips.some(t => t.id === S.cur)) S.cur = S.trips[0] ? S.trips[0].id : null;
let tab = "home";
let showResult = false;
let form = { date: today(), cur: "KRW", payer: "", cat: "", catAuto: true };
let calcCur = "USD";
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const trip = () => S.trips.find(t => t.id === S.cur) || null;

function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2200); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast("복사했습니다");
}

// ============ 계산 ============
function split(amount, ws) { // 비율대로 나누고 원 단위 나머지는 소수점 큰 순으로 1원씩
  const W = ws.reduce((a, b) => a + b, 0) || 1;
  const exact = ws.map(w => amount * w / W);
  const base = exact.map(Math.floor);
  let rest = amount - base.reduce((a, b) => a + b, 0);
  const order = exact.map((e, k) => ({ k, f: e - Math.floor(e) })).sort((a, b) => b.f - a.f);
  for (let j = 0; rest > 0; j++, rest--) base[order[j % order.length].k]++;
  return base;
}
function compute(t) {
  const owe = {}, paid = {}, w = {};
  t.members.forEach(m => { owe[m.id] = 0; paid[m.id] = 0; w[m.id] = Math.max(Number(m.weight) || 1, 0.1); });
  let total = 0; const byCat = {}, byDay = {}, byCur = {};
  t.expenses.filter(e => e.amount > 0).forEach(e => {
    const krw = Math.round(e.amount * e.rate);
    e.krw = krw; total += krw;
    if (!e.fromFund) { // 공동경비로 낸 지출은 개인 간 송금 계산에서 제외
      if (paid[e.payer] !== undefined) paid[e.payer] += krw;
      const ids = e.members.filter(id => owe[id] !== undefined);
      if (ids.length) { const parts = split(krw, ids.map(id => w[id])); ids.forEach((id, k) => owe[id] += parts[k]); }
    }
    const cat = e.cat || guessCat(e.name || "") || "기타"; byCat[cat] = (byCat[cat] || 0) + krw;
    byDay[e.date] = (byDay[e.date] || 0) + krw;
    byCur[e.cur] = byCur[e.cur] || { amt: 0, krw: 0 };
    byCur[e.cur].amt += e.amount; byCur[e.cur].krw += krw;
  });
  const give = [], take = [];
  t.members.forEach(m => { const v = paid[m.id] - owe[m.id]; if (v < 0) give.push({ id: m.id, v: -v }); else if (v > 0) take.push({ id: m.id, v }); });
  give.sort((a, b) => b.v - a.v); take.sort((a, b) => b.v - a.v);
  const transfers = []; let a = 0, b = 0;
  while (a < give.length && b < take.length) {
    const m = Math.min(give[a].v, take[b].v);
    transfers.push({ from: give[a].id, to: take[b].id, amt: m });
    give[a].v -= m; take[b].v -= m;
    if (give[a].v === 0) a++; if (take[b].v === 0) b++;
  }
  return { owe, paid, total, byCat, byDay, byCur, transfers };
}
const nameOf = (t, id) => (t.members.find(m => m.id === id) || { name: "?" }).name;
function avgRate(t, cur) { // 환전 기록의 가중 평균 환율
  const rec = (t.exch || []).filter(x => x.cur === cur);
  const k = rec.reduce((s, x) => s + x.krw, 0), f = rec.reduce((s, x) => s + x.foreign, 0);
  return f > 0 ? k / f : null;
}
function guessCat(name) {
  for (const c in KEYWORDS) if (KEYWORDS[c].some(k => name.includes(k))) return c;
  return "";
}

// ============ 지출 한 줄(행) ============
const hintText = e => e.amount > 0 && e.rate > 0
  ? `≈ ${won(Math.round(e.amount * e.rate))} (1${ck(e.cur)} = ${num(e.rate, 4)}원 적용)`
  : "금액을 입력하면 원화로 얼마인지 보여 드려요.";
function blankRow(t) {
  const cur = form.cur || "KRW";
  return { id: uid(), date: today(), name: "", cat: "", amount: 0, cur, rate: S.rates[cur],
    payer: t.members.some(m => m.id === form.payer) ? form.payer : t.members[0].id, members: t.members.map(m => m.id) };
}
function rowHtml(e, i, t) {
  const curOpts = Object.keys(CURS).map(c => `<option value="${c}" ${e.cur === c ? "selected" : ""}>${cs(c)} ${CURS[c][0]}</option>`).join("");
  const catOpts = ["", ...ALLCATS].map(c => `<option value="${c}" ${(e.cat || "") === c ? "selected" : ""}>${c || "자동"}</option>`).join("");
  return `<div class="erow" data-eid="${e.id}">
    <div class="erow-head"><b>${i + 1}</b><button class="del" data-act="delExp" data-id="${e.id}">삭제</button></div>
    <div class="row"><div><label>누가 냈나요</label><select data-f="payer">${t.members.map(m => `<option value="${m.id}" ${e.payer === m.id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select></div>
    <div><label>통화</label><select data-f="cur">${curOpts}</select></div></div>
    <label>금액 (<span data-sym>${cs(e.cur)}</span>)</label>
    <input data-f="amount" type="number" step="any" inputmode="decimal" placeholder="예: 5800" value="${e.amount > 0 ? e.amount : ""}">
    <p class="note" data-hint>${hintText(e)}</p>
    <details><summary>자세히 (항목, 날짜, 함께한 사람, 환율)</summary>
      <label>항목 이름 (선택)</label><input data-f="name" type="text" placeholder="예: 라멘, 택시" value="${esc(e.name || "")}">
      <div class="row"><div><label>카테고리</label><select data-f="cat">${catOpts}</select></div>
      <div><label>날짜</label><input data-f="date" type="date" value="${e.date}"></div></div>
      <label>환율 (1<span data-unit>${ck(e.cur)}</span> = 몇 원)</label>
      <div class="row"><div><input data-f="rate" type="number" step="any" inputmode="decimal" value="${e.rate}"></div>
      <button class="sub small" data-act="rateBase" data-id="${e.id}">오늘 환율</button><button class="sub small" data-act="rateAvg" data-id="${e.id}">내 환전 평균</button></div>
      <label>함께한 사람 (체크한 사람끼리 나눠요)</label>
      <div class="checks">${t.members.map(m => `<label><input type="checkbox" data-f="mem" value="${m.id}" ${e.members.includes(m.id) ? "checked" : ""}>${esc(m.name)}</label>`).join("")}</div>
    </details></div>`;
}
function rowUpdate(el) {
  const rowEl = el.closest("[data-eid]"); if (!rowEl) return false;
  const t = trip(); if (!t) return true;
  const e = t.expenses.find(x => x.id === rowEl.dataset.eid); if (!e) return true;
  const f = el.dataset.f;
  if (f === "amount") e.amount = parseFloat(el.value) || 0;
  else if (f === "rate") e.rate = parseFloat(el.value) || 0;
  else if (f === "mem") e.members = [...rowEl.querySelectorAll('[data-f="mem"]:checked')].map(c => c.value);
  else if (f === "cur") {
    e.cur = el.value; e.rate = S.rates[e.cur]; form.cur = e.cur;

}

// ============ 화면: 통계 ============
function bars(entries, fmt, total) {
  const max = Math.max(...entries.map(e => e[1]), 1);
  return entries.map(([k, v]) => `<div class="bar"><span class="lb">${esc(k)}</span><div class="bg"><i style="width:${Math.round(v / max * 100)}%"></i></div><span class="val">${fmt(v)}${total ? " · " + Math.round(v / total * 100) + "%" : ""}</span></div>`).join("");
}
// 날짜별·카테고리별로 직접 적은 지출(현지 통화)을 원화로 환산해 모아 둔다
const COLORS = { 식비: "#c9a45c", 교통: "#6d8fe8", 숙박: "#7fbf9b", 쇼핑: "#d9827f", 기타: "#8d96a7" };
function daily(t) { t.daily = t.daily || {}; return t.daily; }
function dayData(t) {
  const f = fund(t), cur = f.cur || "JPY", r = S.rates[cur] || 1, n = f.days > 0 ? Math.floor(f.days) : 0;
  const dd = daily(t), byDay = [], byCat = {}; let total = 0, filled = 0;
  CATS.forEach(c => byCat[c] = 0);
  for (let d = 1; d <= n; d++) {
    const row = dd[d] || {}, cats = {}; let sum = 0;
    CATS.forEach(c => { const w = Math.round((parseFloat(row[c]) || 0) * r); cats[c] = w; sum += w; byCat[c] += w; });
    if (sum > 0) filled++;
    total += sum; byDay.push({ d, cats, sum });
  }
  return { n, byDay, byCat, total, filled, cur, r };
}
function daySumText(t, d) {
  const f = fund(t), cur = f.cur || "JPY", r = S.rates[cur] || 1, row = daily(t)[d] || {};
  const loc = CATS.reduce((s, c) => s + (parseFloat(row[c]) || 0), 0);
  return loc > 0 ? `${cs(cur)}${num(loc, r >= 100 ? 2 : 0)} · ${won(loc * r)}` : "미입력";
}
function statsOut(t) {
  const f = fund(t), D = dayData(t), plan = allocOf(f);
  if (D.total === 0) return '<div class="card"><p class="empty">금액을 적으면 예산과 비교한 그래프가 나와요.</p></div>';
  const fx = v => cs(D.cur) + num(v / D.r, D.r >= 100 ? 2 : 0);
  const hasBudget = f.budget > 0, done = D.filled >= D.n;
  let head = "";
  if (hasBudget) {
    const diff = f.budget - D.total, pct = Math.round(D.total / f.budget * 100);
    const msg = done ? (diff >= 0 ? `예산보다 ${won(diff)} 아꼈어요` : `예산보다 ${won(-diff)} 더 썼어요`)
      : (diff >= 0 ? `지금까지 ${won(D.total)} 썼고 예산이 ${won(diff)} 남았어요` : `지금까지 ${won(D.total)} 써서 예산을 ${won(-diff)} 넘었어요`);
    head = `<div class="big" style="font-size:20px;color:${diff >= 0 ? "var(--accent)" : "var(--danger)"}">${msg}</div>
      <div class="bar"><span class="lb">사용 ${pct}%</span><div class="bg"><i style="width:${Math.min(pct, 100)}%;${pct > 100 ? "background:var(--danger)" : ""}"></i></div><span class="val">${won(D.total)}</span></div>
      <div class="line"><span>계획한 예산</span><b>${won(f.budget)}</b></div>`;
  } else head = '<p class="note">예산 탭에서 총 예산을 정하면 계획과 비교해 드려요.</p>';
  head += `<div class="line"><span>쓴 돈 (${D.filled}/${D.n}일 기록)</span><b>${won(D.total)} · ${fx(D.total)}</b></div>
    <div class="line"><span>하루 평균</span><b>${won(D.total / Math.max(D.filled, 1))}</b></div>`;
  if (hasBudget) {
    const rest = f.budget - D.total, left = D.n - D.filled, pct2 = Math.round(D.total / f.budget * 100);
    if (left > 0) head += `<div class="line"><span>하루 권장 지출 (남은 ${left}일)</span><b>${won(Math.max(rest, 0) / left)} · ${fx(Math.max(rest, 0) / left)}</b></div>`;
    if (pct2 > 100) head += '<p class="note" style="color:var(--danger)">예산을 넘었어요.</p>';
    else if (pct2 >= 80) head += '<p class="note" style="color:var(--danger)">예산의 80%를 넘었어요.</p>';
  }
  const dayBudget = hasBudget && D.n ? f.budget / D.n : 0;
  const maxDay = Math.max(...D.byDay.map(x => x.sum), dayBudget, 1);
  const legend = CATS.map(c => `<span class="lg"><i class="dot" style="background:${COLORS[c]}"></i>${c}</span>`).join("");
  const dayRows = D.byDay.map(x => `<div class="bar"><span class="lb">${x.d}일차</span><div class="bg stack">${CATS.map(c => x.cats[c] ? `<i style="width:${x.cats[c] / maxDay * 100}%;background:${COLORS[c]}"></i>` : "").join("")}${dayBudget ? `<u style="left:${dayBudget / maxDay * 100}%"></u>` : ""}</div><span class="val">${x.sum ? won(x.sum) : "-"}</span></div>`).join("");
  const hasPlan = CATS.some(c => plan[c] > 0), planAmt = c => parseFloat(plan[c]) || 0;
  const maxC = Math.max(...CATS.map(c => Math.max(planAmt(c), D.byCat[c])), 1);
  const cmp = CATS.map(c => {
    const p = planAmt(c), a = D.byCat[c], over = hasPlan && a > p;
    const note = hasPlan ? (a === 0 && p === 0 ? "" : over ? `${won(a - p)} 초과` : `${won(p - a)} 아낌`) : "";
    return `<div class="cmp"><div class="cmp-h"><b>${c}</b><span style="color:${over ? "var(--danger)" : "var(--accent)"}">${note}</span></div>
      ${hasPlan ? `<div class="bar"><span class="lb">계획</span><div class="bg"><i style="width:${p / maxC * 100}%;background:#4a5568"></i></div><span class="val">${won(p)}</span></div>` : ""}
      <div class="bar"><span class="lb">실제</span><div class="bg"><i style="width:${a / maxC * 100}%;background:${over ? "var(--danger)" : COLORS[c]}"></i></div><span class="val">${won(a)}</span></div></div>`;
  }).join("");
  let acc = 0;
  const used = CATS.filter(c => D.byCat[c] > 0);
  const stops = used.map(c => { const p = D.byCat[c] / D.total * 100, s = `${COLORS[c]} ${acc}% ${acc + p}%`; acc += p; return s; }).join(", ");
  const pieLegend = used.map(c => `<div class="line"><span><i class="dot" style="background:${COLORS[c]}"></i>${c}</span><b>${Math.round(D.byCat[c] / D.total * 100)}% · ${won(D.byCat[c])}</b></div>`).join("");
  return `<div class="card"><h2>예산 비교</h2>${head}</div>
    <div class="card"><h2>언제 얼마 썼나</h2><div class="legend">${legend}</div>${dayRows}${dayBudget ? `<p class="note">흰 세로선은 하루 예산(${won(dayBudget)})이에요.</p>` : ""}</div>
    <div class="card"><h2>무엇에 썼나 (계획과 비교)</h2>${cmp}</div>
    <div class="card"><h2>쓴 돈의 비율</h2><div class="pie" style="background:radial-gradient(circle at center, #171c25 0 42%, transparent 43%), conic-gradient(${stops})"></div>${pieLegend}</div>`;
}
function viewStats() {
  const t = trip();

// ============ 화면: 공동경비 ============
function fund(t) { t.fund = t.fund || { per: 0, budget: 0, days: 0 }; t.sent = t.sent || {}; return t.fund; }
const krwOf = e => Math.round(e.amount * e.rate);
const sentLabel = (n, m) => `${n}/${m} 송금 완료` + (m > 0 && n === m ? " · 정산 끝!" : "");
function sentText(t, transfers) {
  fund(t);
  return sentLabel(transfers.filter(x => t.sent[`${x.from}>${x.to}>${x.amt}`]).length, transfers.length);
}
function budgetInfo(t) {
  const f = fund(t);
  if (!(f.budget > 0)) return '<p class="empty">총 예산을 넣으면 환전할 금액과 하루 한도를 보여 드려요.</p>';
  const cur = f.cur || "JPY", r = S.rates[cur] || 1, fd = r >= 100 ? 2 : 0;
  const fx = v => cs(cur) + num(v / r, fd);
  let h = `<label style="margin-top:0">환전해 갈 금액 (예산 ÷ 환율)</label><div class="big">${fx(f.budget)}</div>
    <p class="note">1${ck(cur)} = ${num(r, 4)}원 기준이에요. 환전 수수료는 빠져 있어요. 환율은 환율 탭에서 고칠 수 있어요.</p>`;
  if (f.days > 0) h += `<div class="line"><span>하루 한도 (${f.days}일)</span><b>${won(f.budget / f.days)} · ${fx(f.budget / f.days)}</b></div>`;
  return h;
}
// ---- 예산 나누기 (카테고리별 금액을 직접 적는 계획, 원 단위) ----
function allocOf(f) { f.alloc = f.alloc || {}; return f.alloc; }
function planSummary(t) {
  const f = fund(t), al = allocOf(f), used = CATS.reduce((a, c) => a + (parseFloat(al[c]) || 0), 0);
  if (!(f.budget > 0)) return { used, label: "남은 금액", value: "총 예산을 먼저 넣어 주세요", over: false };
  const rest = f.budget - used;
  return rest >= 0 ? { used, label: "남은 금액", value: won(rest), over: false } : { used, label: "초과", value: `${won(-rest)} 초과됐어요`, over: true };
}
function spentByCat(t) { return dayData(t).byCat; }
function planVals(t, c) {
  const f = fund(t), amt = parseFloat(allocOf(f)[c]) || 0, cur = f.cur || "JPY", r = S.rates[cur] || 1, fd = r >= 100 ? 2 : 0;
  return {
    main: amt > 0 ? `${cs(cur)}${num(amt / r, fd)}` : "",
    sub: amt > 0 && f.days > 0 ? "하루 " + won(amt / f.days) : ""
  };
}
function planHtml(t) {
  const f = fund(t), al = allocOf(f), s = planSummary(t);
  return `<p class="note" style="margin-top:0">카테고리마다 쓸 금액을 원 단위로 적어요. 숙박과 항공권은 미리 예약하는 비용이라 포함하지 않아요.</p>
    ${CATS.map(c => { const v = planVals(t, c); return `<div class="plan-row" data-cat="${c}"><span class="pn">${c}</span>
      <input type="number" inputmode="numeric" data-p="${c}" value="${al[c] > 0 ? al[c] : ""}" placeholder="0"><span class="mute" style="margin:0">원</span>
      <div class="pv"><b data-pv>${v.main}</b><small data-ps>${v.sub}</small></div></div>`; }).join("")}
    <div class="line" style="margin-top:6px"><span>나눈 금액</span><b id="planUsed">${won(s.used)}</b></div>
    <div class="line"><span id="planLabel">${s.label}</span><b id="planRest" style="color:${s.over ? "var(--danger)" : "var(--accent)"}">${s.value}</b></div>`;
}
function updatePlan(t) {
  document.querySelectorAll(".plan-row").forEach(row => {
    const v = planVals(t, row.dataset.cat);
    row.querySelector("[data-pv]").textContent = v.main;
    row.querySelector("[data-ps]").textContent = v.sub;
  });
  const s = planSummary(t);
  if ($("planUsed")) $("planUsed").textContent = won(s.used);
  if ($("planLabel")) $("planLabel").textContent = s.label;
  if ($("planRest")) { $("planRest").textContent = s.value; $("planRest").style.color = s.over ? "var(--danger)" : "var(--accent)"; }
}
function viewBudget() {
  const t = trip();
  if (!t) return startCard();
  const f = fund(t), cur = f.cur || "JPY";
  return `<div class="card"><h2>예산 설정</h2>
    <label style="margin-top:0">총 예산 (원)</label><input type="number" inputmode="numeric" data-b="budget" value="${f.budget || ""}" placeholder="예: 1000000">
    <div class="row"><div><label>여행 일수 (3박 4일은 4)</label><input type="number" inputmode="numeric" data-b="days" value="${f.days || ""}" placeholder="예: 6"></div>
    <div><label>현지 통화</label><select data-b="cur">${Object.keys(CURS).filter(c => c !== "KRW").map(c => `<option value="${c}" ${c === cur ? "selected" : ""}>${cs(c)} ${CURS[c][0]}</option>`).join("")}</select></div></div></div>
    <div class="card"><h2>환전과 한도</h2><div id="budgetBox">${budgetInfo(t)}</div></div>
    <div class="card"><h2>예산 나누기 (직접 적기)</h2>${planHtml(t)}</div>`;
}

// ============ 렌더 ============
function render() {
  const t = trip();
  $("tripLine").textContent = t ? "현재 여행: " + t.name : "여행을 만들어 시작하세요";
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("view").innerHTML = ({ home: viewHome, rates: viewRates, stats: viewStats, budget: viewBudget })[tab]();
  if (tab === "rates") updateCalc();
  if (tab === "home") updateHint();
}
function updateHint() {
  if (!$("eHint")) return;
  const a = parseFloat($("eAmt").value), r = parseFloat($("eRate").value);
  $("eHint").textContent = a > 0 && r > 0 ? `≈ ${won(Math.round(a * r))} (1${ck($("eCur").value)} = ${num(r, 4)}원 적용)` : "금액을 입력하면 원화로 얼마인지 보여 드려요.";
}
function updateCalc() {
  if (!$("cAmt")) return;
  const r = S.rates[calcCur];
  const a = parseFloat($("cAmt").value);
  $("cRes").textContent = a > 0 ? won(a * r) : "0원";
  const k = parseFloat($("cKrw").value);
  $("cRes2").textContent = cs(calcCur) + (k > 0 ? num(k / r) : "0");
  $("cNote").textContent = `1${ck(calcCur)} = ${num(r, 4)}원 (기준환율)`;
  $("cLabel").textContent = ck(calcCur) + " 금액 (" + cs(calcCur) + ")";
}

// ============ 동작 ============
function newTrip(name) {
  const t = { id: uid(), name: name || "새 여행", members: [], expenses: [], exch: [], fund: { per: 0, budget: 0, days: 0 }, sent: {} };
  S.trips.push(t); S.cur = t.id; save(); return t;
}
function importFromHash() {
  const m = location.hash.match(/^#t=(.+)$/); if (!m) return;
  try {
    let s = m[1].replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
    const d = JSON.parse(decodeURIComponent(escape(atob(s))));
    d.id = uid(); d.name = "(공유받음) " + d.name; S.trips.push(d); S.cur = d.id; save();
    history.replaceState(null, "", location.pathname);
    setTimeout(() => toast("공유받은 여행을 불러왔습니다"), 300);
  } catch (e) { setTimeout(() => toast("링크를 읽을 수 없습니다"), 300); }
}
function makeLink(t) {
  const json = JSON.stringify({ name: t.name, members: t.members, expenses: t.expenses.map(e => { const { krw, ...r } = e; return r; }), exch: t.exch || [], fund: t.fund || null });
  return location.origin + location.pathname + "#t=" + btoa(unescape(encodeURIComponent(json))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function fetchRates() {
  try {
    const r = await fetch("https://open.er-api.com/v6/latest/KRW"); const j = await r.json();
    if (j.result !== "success") throw new Error("fail");
    let n = 0;
    Object.keys(CURS).forEach(c => { if (c !== "KRW" && j.rates[c]) { S.rates[c] = +(1 / j.rates[c]).toFixed(c === "VND" ? 4 : 2); n++; } });
    S.rateTime = new Date().toLocaleString("ko-KR"); save(); render(); toast(n + "개 통화 환율을 불러왔습니다");
  } catch (e) { toast("불러오지 못했습니다. 환율을 직접 입력해 주세요."); }
}

function act(a, b) {
  const t = trip();
  if (a === "resetAll") {
    if (!t || !confirm(`"${t.name}" 여행의 참여자와 입력한 내용이 모두 지워지고 처음 화면으로 돌아갑니다. 계속할까요?`)) return;
    S.trips = S.trips.filter(x => x.id !== t.id); S.cur = null; showResult = false; form.payer = ""; save(); tab = "home"; render(); window.scrollTo(0, 0);
  }
  if (a === "newTrip") { const v = $("tName").value.trim(); if (!v) { alert("여행 이름을 입력해 주세요."); return; } newTrip(v); render(); }
  if (a === "pickTrip") { S.cur = b.dataset.id; save(); tab = "home"; render(); }
  if (a === "delTrip") { if (!confirm("이 여행을 삭제할까요? 되돌릴 수 없습니다.")) return; S.trips = S.trips.filter(x => x.id !== b.dataset.id); if (S.cur === b.dataset.id) S.cur = S.trips[0] ? S.trips[0].id : null; save(); render(); }
  if (a === "addMember") {
    const v = $("mName").value.trim(); if (!v) return;
    if (t.members.some(m => m.name === v)) { alert("이미 있는 이름입니다."); return; }
    const nm = { id: uid(), name: v, weight: 1 }; t.members.push(nm); t.expenses.forEach(e => e.members.push(nm.id));
    save(); render(); if ($("mName")) $("mName").focus();
  }
  if (a === "delMember") {
    const id = b.dataset.id;
    if (t.expenses.some(e => e.amount > 0 && (e.payer === id || e.members.includes(id))) || (t.exch || []).some(x => x.who === id)) { alert("이 사람이 포함된 지출이나 환전 기록이 있습니다. 먼저 삭제해 주세요."); return; }
    t.members = t.members.filter(m => m.id !== id);
    t.expenses.forEach(e => { e.members = e.members.filter(x => x !== id); if (e.payer === id && t.members[0]) e.payer = t.members[0].id; });
    showResult = false; save(); render();
  }
  if (a === "cat") { form.cat = form.cat === b.dataset.v ? "" : b.dataset.v; form.catAuto = false; document.querySelectorAll("#catChips .chip").forEach(x => x.classList.toggle("on", x.dataset.v === form.cat)); }
  if (a === "rateBase" || a === "rateAvg") {
    const e = t.expenses.find(x => x.id === b.dataset.id); if (!e) return;
    const r = a === "rateBase" ? S.rates[e.cur] : avgRate(t, e.cur);
    if (!r) { toast("이 통화의 환전 기록이 없습니다"); return; }
    e.rate = +Number(r).toFixed(4); save();
    const rowEl = b.closest("[data-eid]");
    rowEl.querySelector('[data-f="rate"]').value = e.rate; rowEl.querySelector("[data-hint]").textContent = hintText(e);
  }
  if (a === "addRow") {
    t.expenses.push(blankRow(t)); showResult = false; save(); render();
    const rows = document.querySelectorAll("[data-eid]"); const last = rows[rows.length - 1];
    if (last) { last.scrollIntoView({ behavior: "smooth", block: "center" }); const inp = last.querySelector('[data-f="amount"]'); if (inp) inp.focus({ preventScroll: true }); }
  }
  if (a === "delExp") { t.expenses = t.expenses.filter(e => e.id !== b.dataset.id); showResult = false; save(); render(); }
  if (a === "calc") {
    const used = t.expenses.filter(e => e.amount > 0);
    if (!used.length) { alert("금액을 입력해 주세요."); return; }
    if (used.some(e => !(e.rate > 0))) { alert("환율을 입력해 주세요. (자세히 > 환율)"); return; }
    if (used.some(e => !e.members.length)) { alert("함께한 사람을 1명 이상 체크해 주세요."); return; }
    showResult = true; render(); setTimeout(() => { const r = $("resultCard"); if (r) r.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50); }
  if (a === "copyResult") {
    const c = compute(t);
    let text = `[${t.name}] 총 ${won(c.total)}\n` + t.members.map(m => `- ${m.name}: 부담 ${won(c.owe[m.id])}`).join("\n") + "\n\n[송금]\n" +
      (c.transfers.length ? c.transfers.map(x => `${nameOf(t, x.from)} → ${nameOf(t, x.to)} ${won(x.amt)}`).join("\n") : "없음");
    copy(text);
  }
  if (a === "copyLink") copy(makeLink(t));
  if (a === "calcCur") { calcCur = b.dataset.v; render(); }
  if (a === "fetchRates") fetchRates();
  if (a === "addExch") {
    const krw = parseFloat($("xKrw").value), foreign = parseFloat($("xFor").value);
    if (!(krw > 0) || !(foreign > 0)) { alert("낸 원화와 받은 외화를 입력해 주세요."); return; }
    t.exch = t.exch || []; t.exch.push({ id: uid(), who: $("xWho").value, cur: $("xCur").value, krw, foreign }); save(); render(); toast("환전 기록을 추가했습니다");
  }
  if (a === "delExch") { t.exch = t.exch.filter(x => x.id !== b.dataset.id); save(); render(); }
}

$("view").addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b) act(b.dataset.act, b); });
$("view").addEventListener("input", e => {
  const el = e.target, t = trip();
  if (el.dataset.b && t) { fund(t)[el.dataset.b] = el.dataset.b === "cur" ? el.value : (parseFloat(el.value) || 0); save(); $("budgetBox").innerHTML = budgetInfo(t); updatePlan(t); return; }
  if (el.dataset.dd && t) {
    const [d, c] = el.dataset.dd.split("|"), dd = daily(t); dd[d] = dd[d] || {}; dd[d][c] = parseFloat(el.value) || 0; save();
    const so = $("statsOut"); if (so) so.innerHTML = statsOut(t);
    const ds = document.querySelector(`[data-dsum="${d}"]`); if (ds) ds.textContent = daySumText(t, d);
    return;
  }
  if (el.dataset.p && t) {
    allocOf(fund(t))[el.dataset.p] = parseFloat(el.value) || 0; save(); updatePlan(t); return;
  }
  if (el.dataset.f && rowUpdate(el)) return;
  if (el.id === "eAmt" || el.id === "eRate") updateHint();
  if (el.id === "eName" && form.catAuto) { const g = guessCat(el.value); form.cat = g; document.querySelectorAll("#catChips .chip").forEach(x => x.classList.toggle("on", x.dataset.v === g)); }
  if (el.dataset.w && t) { const m = t.members.find(x => x.id === el.dataset.w); if (m) { m.weight = parseFloat(el.value) || 1; save(); } }
  if (el.dataset.rate) { const v = parseFloat(el.value); if (v > 0) { S.rates[el.dataset.rate] = v; save(); } }
  if (el.id === "cAmt" || el.id === "cKrw") updateCalc();
});
$("view").addEventListener("change", e => {
  if (e.target.id === "eCur") { form.cur = e.target.value; $("eRate").value = S.rates[form.cur]; $("eUnit").textContent = ck(form.cur); $("eSym").textContent = cs(form.cur); updateHint(); }
});
$("view").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "mName") act("addMember"); if (e.target.id === "tName") act("newTrip");
});
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });

$("view").addEventListener("change", e => {
  const k = e.target.dataset.sent; if (k === undefined) return;
  const t = trip(); if (!t) return; fund(t);
  t.sent[k] = e.target.checked; save();
  e.target.closest(".tr").classList.toggle("done", e.target.checked);
  const all = [...document.querySelectorAll("[data-sent]")];
  $("sentSum").textContent = sentLabel(all.filter(c => c.checked).length, all.length);
});

importFromHash();
render();
</script>
</body>
</html>
